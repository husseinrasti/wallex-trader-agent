# All tunable parameters. config_hash = sha256(canonical json of the resolved config)[:12]
# is written into every decision record. "${VAR}" is resolved from the environment (empty -> null).
engine:
  fast_loop_interval_s: 2
  slow_loop_interval_s: 300
  reviewer_interval_s: 3600
  reconcile_interval_s: 300
  heartbeat_interval_s: 60
  equity_row_interval_s: 10
  stale_data_s: 30
  initial_equity_tmn: 5000000
  challenge_start_utc: "${CHALLENGE_START_UTC}"
  challenge_end_utc: "${CHALLENGE_END_UTC}"
  flatten_start_before_end_s: 7200     # T-2h
  flatten_final_before_end_s: 1800     # T-30min
  final_state_before_end_s: 300        # T-5min: log final_state
  rng_seed: 42
  symbol_cooldown_s: 30                # after any fill on a symbol
  exception_storm_count: 3             # >= N engine-loop crashes ...
  exception_storm_window_s: 600        # ... within this window -> kill
data:
  sqlite_path: data/wta.sqlite                 # market data written by the recorder
  state_sqlite_path: data/state_{mode}.sqlite   # engine state (kv, positions, orders, equity) per mode
  depth_levels_stored: 10
  rest_poll_interval_s: 2
  rest_poll_use_depth_all: true        # one /depth/all call per poll instead of one call per symbol
  candle_poll_interval_s: 60
  ws_enabled: true
  ws_reconnect_max_s: 60
  rate_limit_rps: 6
  http_timeout_s: 8
  max_retries: 4
  store_flush_interval_s: 1
  store_flush_rows: 200
risk:
  max_order_pct_equity: 0.25
  max_order_pct_of_best_level_qty: 0.8
  max_coin_exposure_pct: 0.40
  max_concurrent_positions: 3
  max_positions_per_strategy: {S1: 2, S3: 1}
  max_open_orders: 8
  max_orders_per_hour: 10
  max_orders_per_day: 60
  daily_loss_limit_pct: 0.025
  max_drawdown_kill_pct: 0.05
  fee_budget_pct: 0.02
  price_disagreement_pause_pct: 0.05
  price_sanity_pct: 0.03               # limit price within +-3% of mid
  consecutive_api_errors_pause: 5
  anomaly_clear_s: 60
  balance_buffer_pct: 0.005
  reconcile_drift_pct: 0.005
  duplicate_cooldown_s: 60
  min_notional_tmn: 50000
  min_notional_usdt: 1
execution:
  poll_interval_s: 2
  limit_reprice_after_s: 15
  limit_max_reprices: 2
  limit_cancel_after_s: 45
  flatten_max_reprices: 3
  maker_offset_ticks: 1
  use_server_side_stops: true
  stop_limit_slippage_pct: 0.004       # STOP_LIMIT limit price = stop * (1 - this) for sells
  flatten_final_cross_pct: 0.005       # T-30min LIMIT at best_bid * (1 - this) where MARKET is disabled
strategies:
  s1_crossbook:
    enabled: true
    coins: [BTC, ETH, SOL, XRP, DOGE, ADA, TRX, LTC, LINK, AVAX]
    margin_min_pct: 0.0015              # above total cost
    leg1_taker: true
    leg2_max_loss_pct: 0.003
    lockin_enabled: true
    revert_enabled: true
    revert_max_hold_s: 1200
    revert_stop_pct: 0.010
    revert_target_fraction: 0.6         # take profit when 60% of deviation closed
    revert_max_concurrent: 1
    z_min: 2.0
    dev_window_s: 3600
    cooldown_s: 60
    max_concurrent: 2
    size_pct_equity: 0.20
  s2_usdtalloc:
    enabled: true
    target_share_by_regime: {range: 0.50, trend_up: 0.65, trend_down: 0.30, chaos: 0.40}
    bounds: [0.25, 0.70]
    rebalance_threshold_pp: 0.15
    min_rebalance_interval_s: 1800
    ema_fast: 20
    ema_slow: 60
    candle_resolution: "15"
    trend_ret_24h_pct: 0.008
    trend_flag_min_gap_pct: 0.0015
    chaos_atr_mult: 2.0
  s3_momentum:
    enabled: false                       # enable after MVP live
    allow_rules_only: false
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
    candle_resolution: "15"
    breakout_lookback: 20
    volume_mult: 1.5
    atr_period: 14
    atr_min_pct: 0.003
    atr_max_pct: 0.03
    stop_atr_mult: 1.5
    target_atr_mult: 2.5
    max_hold_s: 14400
    risk_per_trade_pct: 0.005
    max_size_pct_equity: 0.20
    min_regime_confidence: 0.6
ai:
  enabled: true
  provider: openrouter                  # openrouter|gemini
  temperature: 0.0
  analyst_tools_enabled: true
  analyst_max_tool_rounds: 6
  analyst_timeout_s: 40
  reviewer_timeout_s: 90
  plan_stale_s: 1200
  max_analyst_calls_per_day: 400
  max_reviewer_calls_per_day: 30
  tool_result_max_bytes: 4096
  cache_dir: logs/llm_cache
  replay_strict: true
  repair_plan_nesting: true          # lift plan keys written inside `regimes` (after the retry), logged as `repaired`
alerts:
  telegram_enabled: false
  # inbound /status /pause /resume /kill: only ONE engine per bot may poll them (false on a second engine)
  telegram_commands_enabled: true
  max_msgs_per_10min: 20
