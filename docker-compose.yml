# Two long-running services sharing ./data and ./logs (PRD-06 §1).
#   docker compose up -d recorder            # market data only
#   docker compose up -d recorder agent      # + agent in WTA_MODE (shadow by default)
#   docker compose up -d recorder agent web  # + read-only web dashboard on http://localhost:8080
#   docker compose run --rm --no-deps agent python -m wta backtest ...   # one-off commands
#     (--no-deps: without it compose also starts the recorder, which agent depends on)
# Live mode additionally needs WTA_LIVE=1 and the agent command's --i-understand-live flag
# (see docs/RUNBOOK.md); the default compose file never trades live. env_file passes .env into every
# container, so each service pins WTA_LIVE: "0" in its own environment: a WTA_LIVE=1 left in .env
# never arms the live guard. Only an explicit `docker compose run -e WTA_LIVE=1 ...` overrides it.
x-common: &common
  build: .
  image: wallex-trader-agent:latest
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./configs/runtime:/app/configs/runtime
  restart: always

services:
  recorder:
    <<: *common
    environment:
      WTA_LIVE: "0"
    command: ["python", "-m", "wta", "record", "--symbols-from", "configs/markets.yaml"]

  agent:
    <<: *common
    depends_on: [recorder]
    environment:
      WTA_MODE: ${WTA_MODE:-shadow}
      WTA_LIVE: "0"
    command: ["sh", "-c", "python -m wta run --mode ${WTA_MODE:-shadow} --log-dir logs/${WTA_MODE:-shadow}"]
    healthcheck:
      # unhealthy when THIS agent (logs/$WTA_MODE, its own --log-dir) wrote no heartbeat in the last
      # 3 minutes (PRD-06 §2 watchdog); the newest mtime counts, never another mode's directory
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('logs/'+os.environ.get('WTA_MODE','shadow')+'/health-*.jsonl'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # read-only web dashboard (wta web): reads ./logs and ./data, never writes, never talks to Wallex.
  # Published on 127.0.0.1 only: the page shows balances and positions, so it is not for the LAN.
  web:
    <<: *common
    environment:
      WTA_MODE: ${WTA_MODE:-shadow}
      WTA_LIVE: "0"
    ports:
      - "127.0.0.1:${WTA_WEB_PORT:-8080}:8080"
    command: ["sh", "-c", "python -m wta web --host 0.0.0.0 --port 8080 --mode ${WTA_MODE:-shadow} --log-dir logs/${WTA_MODE:-shadow}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/snapshot', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # optional second engine next to a live agent: alerts yes, Telegram commands no (only one
  # engine per bot may poll /status /pause /resume /kill)
  shadow:
    <<: *common
    profiles: ["shadow"]
    environment:
      WTA_MODE: shadow
      WTA_LIVE: "0"
    command: ["python", "-m", "wta", "run", "--mode", "shadow", "--log-dir", "logs/shadow",
              "--set", "alerts.telegram_commands_enabled=false"]
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('logs/'+os.environ.get('WTA_MODE','shadow')+'/health-*.jsonl'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
