[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wta"
version = "0.1.0"
description = "Wallex Trader Agent - autonomous, explainable, risk-first spot trading agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "websockets>=13",          # Wallex WS v2 is Centrifugo over plain websockets (see docs/DECISIONS.md)
  "rich>=13",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "orjson>=3.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21", "freezegun>=1.5"]

[project.scripts]
wta = "wta.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["wta*", "backtest*"]

[tool.setuptools.package-data]
"wta.ai" = ["prompts/*.md"]
"wta.dashboard" = ["web_static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP040"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
